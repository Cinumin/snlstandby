<!doctype html><meta charset="utf-8">
<style>
 body{font:14px system-ui;width:310px;padding:12px}
 label{display:block;margin-top:8px;font-weight:600}
 input,select{width:100%;box-sizing:border-box;padding:6px}
 button{margin-top:10px;padding:8px;width:100%}
 #info{margin-top:10px;color:#444}
</style>
<label>First name<input id="first" autocomplete="given-name"></label>
<label>Last name<input id="last" autocomplete="family-name"></label>
<label>Email<input id="email" type="email" autocomplete="email"></label>
<label>People in party<select id="party"><option>1</option><option>2</option></select></label>
<label>Show date (Saturday)<input id="showDate" type="date"></label>
<label>Session<select id="session">
  <option value="both">Dress rehearsal + Live</option>
  <option value="dress">Dress rehearsal (8pm)</option>
  <option value="live">Live show (11:30pm)</option></select></label>
<label>Standby reservation URL (from NBC's SNL tickets page)<input id="url" placeholder="https://..."></label>
<button id="save">Save &amp; arm alerts</button>
<button id="here">Manual mode: run on this tab now</button>
<div id="info"></div>
<script src="util.js"></script><script src="popup.js"></script>
